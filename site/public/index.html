<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crash & Double</title>
<style>
:root{--bg:#10191f;--pn:#1a2a33;--pn2:#22343f;--bd:#2c4552;--tx:#e8f1f5;--mut:#7f98a5;--yl:#f5e342;--bl:#2aa9c9;--rd:#c8302a;--gr:#3ea63e;--bk:#0c0c0c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,Segoe UI,sans-serif}
nav{display:flex;align-items:center;gap:4px;background:var(--pn);border-bottom:1px solid var(--bd);padding:6px 12px;flex-wrap:wrap}
.tab{background:none;border:0;color:var(--mut);font-size:1rem;font-weight:700;padding:8px 10px;cursor:pointer;border-bottom:3px solid transparent}
.tab.on{color:var(--tx);border-color:var(--yl)}
.right{margin-left:auto;display:flex;gap:10px;align-items:center;font-weight:800}.right span{color:var(--yl)}
.right button{background:none;border:1px solid var(--bd);color:var(--mut);border-radius:6px;padding:5px 9px;cursor:pointer}
.fake{font-size:.72rem;color:var(--mut);text-align:center;padding:6px}
.wrap{max-width:1000px;margin:0 auto;padding:0 12px 20px}
.main{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media(max-width:760px){.main{grid-template-columns:1fr}}
.hide{display:none!important}
.box{background:var(--pn);border:1px solid var(--bd);border-radius:10px;padding:12px}
canvas{width:100%;display:block;background:var(--pn);border:1px solid var(--bd);border-radius:6px}
.stage{position:relative}
.mult{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(2.6rem,10vw,5rem);color:var(--yl);pointer-events:none;font-weight:600}
.mult.crash{color:#ff5a4d}.mult small{font-size:1rem;color:var(--mut)}
label{font-size:.85rem;color:var(--mut);display:block;margin:10px 0 4px}
.row{display:flex}
input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:11px;border:0;background:#fff;color:#111;border-radius:3px 0 0 3px}
.sq{width:48px;border:0;font-size:1.3rem;font-weight:700;cursor:pointer;background:var(--yl);color:#111;border-left:1px solid #0003}
.sq:last-child{border-radius:0 3px 3px 0}.sq.g{background:#9aa5ad}
.go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:3px;font:inherit;font-size:1.05rem;font-weight:700;cursor:pointer;background:var(--yl);color:#111}
.go:disabled{background:#8c97a0;color:#2a343b;cursor:not-allowed}.go.cash{background:var(--gr);color:#fff}
.hist{display:flex;gap:14px;overflow-x:auto;background:var(--pn);border:1px solid var(--bd);border-radius:8px;padding:10px 14px;margin:12px 0;color:var(--mut);font-size:.9rem;white-space:nowrap}
.hist b{color:var(--tx)}.hist .h{color:var(--gr)}
.msg{min-height:1.4em;margin-top:8px;font-weight:700;text-align:center}.w{color:var(--gr)}.l{color:#ff6b5e}
.chips{display:flex;border:1px solid var(--bd);border-radius:4px;overflow:hidden;margin-bottom:8px}
.chips button{flex:1;padding:9px 2px;background:var(--pn2);border:0;border-right:1px solid var(--bd);color:var(--bl);font-weight:700;cursor:pointer}
.wheelwrap{position:relative;max-width:440px;margin:0 auto}
.wheelwrap canvas{border:0;background:none;border-radius:50%}
.ptr{position:absolute;left:50%;top:-6px;transform:translateX(-50%);border:12px solid transparent;border-top:20px solid var(--yl);border-bottom:0;z-index:2}
.ctr{position:absolute;left:50%;top:50%;width:42%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:clamp(2rem,9vw,3.4rem);font-weight:800;color:#fff;background:var(--pn2);border:10px solid #1a2a33;text-align:center;line-height:1}
.ctr small{font-size:.8rem;font-weight:600;opacity:.85}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.cols button{border:0;border-radius:4px;padding:18px 4px;color:#fff;font-weight:800;font-size:1rem;cursor:pointer}
.cols button small{display:block;font-weight:500;opacity:.9;margin-top:4px}
.cols button:disabled{opacity:.45;cursor:not-allowed}
.dh{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.dh span{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.85rem;color:#fff}
.n0{background:var(--gr)}.n1{background:var(--rd)}.n2{background:var(--bk);border:1px solid #444}
.lst{font-size:.85rem;max-height:150px;overflow:auto;margin-top:10px}
.lst div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--bd)}
.chat{margin-top:14px}.chat h3{margin:0 0 8px;font-size:1rem}
#cl{height:200px;overflow:auto;font-size:.9rem;background:var(--bg);border-radius:6px;padding:8px}
#cl p{margin:0 0 4px;word-break:break-word}#cl b{color:var(--bl)}
.cin{display:flex;margin-top:8px}.cin input{border-radius:3px 0 0 3px}.cin button{border:0;background:var(--yl);padding:0 18px;font-weight:700;cursor:pointer;border-radius:0 3px 3px 0}
#login{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
#login .box{width:100%;max-width:340px}#login input{border-radius:3px;margin-bottom:8px;width:100%;flex:none}
#login .go{margin-top:4px}
table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left}
</style></head><body>
<nav>
 <button class="tab on" data-t="crash">🚀 Crash game</button>
 <button class="tab" data-t="dbl">🎡 Double game</button>
 <button class="tab" data-t="top">🏆 En iyi oyuncular</button>
 <div class="right"><div id="who"></div><div>🪙 <span id="bal">0</span></div><button id="out">Çıkış</button></div>
</nav>
<div class="fake">Sahte jeton ile oynanan eğlence sitesi — gerçek para yoktur, kazanç/kayıp gerçek değildir.</div>
<div class="wrap">
<div id="crash"><div class="main">
 <div class="stage"><canvas id="cv" width="640" height="380"></canvas><div class="mult" id="cm">1.00x</div></div>
 <div class="box">
  <label style="margin-top:0">Bahis (Asgari: 10, Azami: 50000)</label>
  <div class="row"><input id="cb" type="number" value="10"><button class="sq" id="cm1">-</button><button class="sq" id="cp1">+</button></div>
  <label>Katsayıda otomatik durma (0 = devre dışı)</label>
  <div class="row"><input id="ca" type="number" value="0" step="0.1"><button class="sq g" id="am">-</button><button class="sq g" id="ap">+</button></div>
  <button class="go" id="cgo">...</button><div class="msg" id="cmsg"></div>
  <div class="lst" id="cbets"></div>
 </div></div>
 <div class="hist" id="chist"></div></div>
<div id="dbl" class="hide"><div class="main">
 <div><div class="wheelwrap"><div class="ptr"></div><canvas id="wv" width="440" height="440"></canvas><div class="ctr" id="dc">?</div></div><div class="dh" id="dh"></div></div>
 <div class="box">
  <div class="chips" id="chips"></div>
  <div class="row"><input id="db" type="number" value="10" style="border-radius:3px"></div>
  <label>Bahis koy (her renge Azami 50000)</label>
  <div class="cols"><button data-c="1" style="background:var(--rd)" id="b1">x2<small>0</small></button><button data-c="0" style="background:var(--gr)" id="b0">x14<small>0</small></button><button data-c="2" style="background:var(--bk)" id="b2">x2<small>0</small></button></div>
  <div class="msg" id="dmsg"></div><div class="lst" id="dbets"></div>
 </div></div></div>
<div id="top" class="hide box"><h3 style="margin-top:0">🏆 En iyi oyuncular</h3><table id="tt"></table></div>
<div class="box chat"><h3>💬 Sohbet</h3><div id="cl"></div>
 <div class="cin"><input id="ci" maxlength="200" placeholder="Mesaj yaz..."><button id="cs">Gönder</button></div></div>
</div>
<div id="login"><div class="box"><h2 style="margin-top:0">🎰 Crash & Double</h2>
 <p style="color:var(--mut);font-size:.85rem">Sahte jetonlarla oyna. Kayıt olunca 10.000 jeton alırsın; jeton yenileme yoktur.</p>
 <input id="ln" placeholder="Kullanıcı adı" autocomplete="username"><input id="lp" type="password" placeholder="Şifre" autocomplete="current-password">
 <button class="go" id="lg">Giriş yap</button><button class="go" id="lr" style="background:var(--bl)">Kayıt ol</button><div class="msg l" id="le"></div></div></div>
<script>
const $=i=>document.getElementById(i),fmt=n=>Math.floor(n).toLocaleString('tr-TR');
const E=Date.UTC(2026,0,1),RATE=.00011,DC=22000,DB=12000,DS=6500,ORDER=[0,1,14,2,13,3,12,4,11,5,10,6,9,7,8],S15=Math.PI*2/15,colOf=n=>n===0?0:n<=7?1:2;
let me=null;try{me=JSON.parse(localStorage.getItem('cd_me'))}catch(e){}
let S=null,off=0,bal=0,tickN=0,topL=null,lastChat='',busy=0;
async function api(o){try{const r=await fetch('/api/rpc',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({n:me&&me.n,tok:me&&me.tok,...o})});return await r.json()}catch(e){return{e:'Bağlantı hatası'}}}
function showLogin(){$('login').classList.remove('hide');$('who').textContent='';$('out').classList.add('hide')}
function logout(){me=null;try{localStorage.removeItem('cd_me')}catch(e){}showLogin()}
async function enter(a){const n=$('ln').value.trim(),p=$('lp').value;$('le').textContent='';const d=await api({a,n,p,tok:null});if(d.e)return $('le').textContent=d.e;me={n:d.n,tok:d.tok};try{localStorage.setItem('cd_me',JSON.stringify(me))}catch(e){}start()}
$('lg').onclick=()=>enter('login');$('lr').onclick=()=>enter('reg');$('out').onclick=logout;
function start(){$('login').classList.add('hide');$('who').textContent=me.n;$('out').classList.remove('hide');poll()}
async function poll(){
 const d=await api({a:'state',lb:tickN++%8===0&&!$('top').classList.contains('hide')});
 if(d.e==='auth'){logout();return}if(d.e)return;
 S=d;off=d.t-Date.now();if(d.me){bal=d.me.bal;$('bal').textContent=fmt(bal)}
 if(d.top){topL=d.top;$('tt').innerHTML='<tr><th>#</th><th>Oyuncu</th><th>Jeton</th></tr>'+d.top.map((x,i)=>`<tr><td>${i+1}</td><td></td><td>${fmt(x.b)}</td></tr>`).join('');[...$('tt').querySelectorAll('tr')].slice(1).forEach((tr,i)=>tr.children[1].textContent=d.top[i].n)}
 const cs=JSON.stringify(d.chat);if(cs!==lastChat){lastChat=cs;const cl=$('cl');cl.innerHTML='';[...d.chat].reverse().forEach(m=>{const p=document.createElement('p'),b=document.createElement('b');b.textContent=m.n+': ';p.append(b,document.createTextNode(m.m));cl.appendChild(p)});cl.scrollTop=cl.scrollHeight}
 renderLists()}
setInterval(()=>{if(me)poll()},1000);
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x===b));['crash','dbl','top'].forEach(t=>$(t).classList.toggle('hide',t!==b.dataset.t));if(b.dataset.t==='top')tickN=0})
async function act(o,el){if(busy)return;busy=1;const d=await api(o);busy=0;if(d.e&&el)el(d.e);poll()}
function chat(){const m=$('ci').value;if(!m.trim())return;$('ci').value='';act({a:'chat',m})}
$('cs').onclick=chat;$('ci').onkeydown=e=>{if(e.key==='Enter')chat()};
/* CRASH */
const cv=$('cv'),cx=cv.getContext('2d'),cmsg=(t,c)=>{$('cmsg').textContent=t;$('cmsg').className='msg '+(c||'')};
const amtIn=()=>Math.max(0,Math.min(50000,Math.floor(+$('cb').value||0)));
$('cm1').onclick=()=>$('cb').value=Math.max(10,amtIn()-10);$('cp1').onclick=()=>$('cb').value=Math.min(50000,amtIn()+10);
$('am').onclick=()=>$('ca').value=Math.max(0,(+$('ca').value||0)-.1).toFixed(2);$('ap').onclick=()=>$('ca').value=((+$('ca').value||0)+.1).toFixed(2);
function myCb(){return S&&S.cr.bets.find(b=>b.n===me.n)}
$('cgo').onclick=()=>{if(!S)return;const mb=myCb(),t=Date.now()+off-S.cr.start;
 if(!mb&&t<0)act({a:'cbet',amt:amtIn(),auto:+$('ca').value||0},e=>cmsg(e,'l'));
 else if(mb&&!mb.m&&t>=0&&S.cr.cp==null)act({a:'ccash'},e=>cmsg(e,'l'))};
function drawC(t,m,crashed){
 const W=640,H=380,p=40,mm=Math.max(2,m*1.15),tm=Math.max(6000,t*1.1);cx.clearRect(0,0,W,H);
 cx.font='13px system-ui';cx.fillStyle='#7f98a5';cx.strokeStyle='#2c4552';cx.lineWidth=1;
 for(let i=0;i<=4;i++){const y=H-p-(H-2*p)*i/4;cx.beginPath();cx.moveTo(p+14,y);cx.lineTo(W-10,y);cx.stroke();cx.fillText((1+(mm-1)*i/4).toFixed(2)+'x',4,y+4)}
 if(t>0){cx.beginPath();cx.strokeStyle=crashed?'#ff5a4d':'#2aa9c9';cx.lineWidth=4;for(let i=0;i<=80;i++){const tt=t*i/80,mv=Math.exp(RATE*tt),x=p+14+(W-p-24)*tt/tm,y=H-p-(H-2*p)*(mv-1)/(mm-1);i?cx.lineTo(x,y):cx.moveTo(x,y)}cx.stroke()}}
function frameC(now){
 if(!S)return;const c=S.cr,t=now-c.start,mb=myCb(),el=$('cm'),b=$('cgo');let m=1,ph;
 if(c.cp!=null){ph='c';m=c.cp}else if(t<0)ph='w';else{ph='r';m=Math.exp(RATE*t)}
 if(ph==='w'){el.className='mult';el.innerHTML='<small>Sonraki tur</small>'+Math.max(0,-t/1000).toFixed(1)+'s'}
 else if(ph==='r'){el.className='mult';el.textContent=m.toFixed(2)+'x'}
 else{el.className='mult crash';el.innerHTML='<small>ÇÖKTÜ</small>'+m.toFixed(2)+'x'}
 drawC(ph==='w'?0:Math.log(m)/RATE,m,ph==='c');
 b.classList.remove('cash');b.disabled=false;
 if(ph==='w'&&!mb){b.textContent='Bahis yap ('+Math.ceil(-t/1000)+'s)'}
 else if(ph==='w'){b.textContent='Bahis koyuldu: '+fmt(mb.amt);b.disabled=true}
 else if(ph==='r'&&mb&&!mb.m){b.textContent='ÇEK  +'+fmt(mb.amt*m);b.classList.add('cash')}
 else{b.textContent='Bir sonraki turu bekleyin...';b.disabled=true}
 if(mb){if(mb.m)cmsg('Çektin: '+mb.m.toFixed(2)+'x → +'+fmt(mb.amt*mb.m-mb.amt),'w');else if(ph==='c')cmsg('Çöktü — −'+fmt(mb.amt),'l');else if(ph==='w')cmsg('Bahis koyuldu')}
 else if($('cmsg').className.indexOf('l')<0||ph==='w')cmsg('')}
/* DOUBLE */
const wx=$('wv').getContext('2d');let rotHold=0;
function drawW(rot){const c=220;wx.clearRect(0,0,440,440);wx.save();wx.translate(c,c);wx.rotate(rot);
 ORDER.forEach((n,i)=>{wx.beginPath();wx.moveTo(0,0);wx.arc(0,0,c-4,-Math.PI/2+i*S15,-Math.PI/2+(i+1)*S15);wx.closePath();wx.fillStyle=['#3ea63e','#c8302a','#0c0c0c'][colOf(n)];wx.fill();wx.strokeStyle='#1a2a33';wx.lineWidth=2;wx.stroke();
  wx.save();wx.rotate(-Math.PI/2+(i+.5)*S15);wx.translate(c-34,0);wx.rotate(Math.PI/2);wx.fillStyle='#fff';wx.font='bold 24px system-ui';wx.textAlign='center';wx.fillText(n,0,8);wx.restore()});wx.restore()}
['⟲','+10','+100','+1K','+10K','x2','1/2','All'].forEach((l,i)=>{const b=document.createElement('button');b.textContent=l;b.onclick=()=>{let v=+$('db').value||0;
 if(i===0)v=0;else if(i<=4)v+=[10,100,1000,10000][i-1];else if(i===5)v*=2;else if(i===6)v=Math.floor(v/2);else v=Math.min(bal,50000);
 $('db').value=Math.max(0,Math.min(50000,Math.floor(v)))};$('chips').appendChild(b)});
document.querySelectorAll('.cols button').forEach(b=>b.onclick=()=>act({a:'dbet',c:+b.dataset.c,amt:Math.floor(+$('db').value||0)},e=>{$('dmsg').textContent=e;$('dmsg').className='msg l'}));
function frameD(now){
 if(!S)return;const id=Math.floor((now-E)/DC),tt=(now-E)%DC,d=S.dbl,same=d.id===id,res=same?d.res:null,c=$('dc');
 let rot=rotHold,fin=0;
 if(res!=null){const want=-(ORDER.indexOf(res)+.5)*S15;fin=Math.PI*2*6+(((want)%(Math.PI*2))+Math.PI*2)%(Math.PI*2)}
 const bets=same?d.bets:[],mine=[0,0,0];bets.forEach(x=>{if(x.n===me.n)mine[x.k]+=x.a});
 for(const k of [0,1,2]){const b=$('b'+k);b.firstElementChild.textContent=fmt(mine[k]);b.disabled=tt>=DB}
 if(tt<DB){c.style.background='var(--pn2)';c.innerHTML='<small>Bahis süresi</small>'+((DB-tt)/1000).toFixed(1);if(res==null&&$('dmsg').className.indexOf('l')<0)$('dmsg').textContent=''}
 else if(res==null){c.style.background='var(--pn2)';c.textContent='…'}
 else if(tt<DB+DS){const p=Math.min(1,(tt-DB)/DS),e=1-Math.pow(1-p,4);rot=fin*e;c.style.background='var(--pn2)';c.textContent='🎡'}
 else{rot=fin;rotHold=fin%(Math.PI*2);const k=colOf(res),tot=mine[0]+mine[1]+mine[2],w=mine[k]*(k?2:14);c.style.background=['var(--gr)','var(--rd)','var(--bk)'][k];c.textContent=res;
  if(tot){$('dmsg').className='msg '+(w?'w':'l');$('dmsg').textContent=w?'🎉 +'+fmt(w-tot):'Kaybettin −'+fmt(tot)}}
 drawW(rot)}
function renderLists(){
 const c=S.cr;$('chist').innerHTML='<span>Geçmiş:</span>'+S.crh.map(v=>`<b class="${v>=2?'h':''}">${(+v).toFixed(2)}x</b>`).join('');
 $('dh').innerHTML=S.dh.map(n=>`<span class="n${colOf(+n)}">${n}</span>`).join('');
 const L=(el,rows)=>{el.innerHTML='';rows.forEach(([a,b])=>{const d=document.createElement('div'),x=document.createElement('span'),y=document.createElement('span');x.textContent=a;y.textContent=b;d.append(x,y);el.appendChild(d)})};
 L($('cbets'),c.bets.map(b=>[b.n,fmt(b.amt)+(b.m?'  ×'+b.m.toFixed(2):'')]));
 const id=Math.floor((Date.now()+off-E)/DC),nm=['Yeşil','Kırmızı','Siyah'];
 L($('dbets'),S.dbl.id===id?S.dbl.bets.map(b=>[b.n+' → '+nm[b.k],fmt(b.a)]):[])}
function loop(){if(me&&S){const now=Date.now()+off;frameC(now);frameD(now)}requestAnimationFrame(loop)}
drawW(0);loop();
if(me){start()}else showLogin();
</script></body></html>
